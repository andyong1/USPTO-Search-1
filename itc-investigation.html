<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ITC Investigation — Documents (internal)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%231a3a6b'/%3E%3Cpath%20d='M7%2025V12l9-6%209%206v13H7z'%20fill='none'%20stroke='white'%20stroke-width='2'%20stroke-linejoin='round'/%3E%3Crect%20x='13'%20y='17'%20width='6'%20height='8'%20fill='white'/%3E%3Ccircle%20cx='16'%20cy='12.5'%20r='2'%20fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/base.css">
  <script src="/theme.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--page-bg); color: var(--text); min-height: 100vh; }
    header { background: var(--brand); color: white; padding: 16px 24px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    header h1 { font-size: 1.2rem; font-weight: 600; line-height: 1.2; }
    header h1 a { color: inherit; text-decoration: none; }
    header p { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }
    .container { max-width: 1300px; margin: 0 auto; padding: 24px 16px 60px; }
    .card { background: var(--surface); border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); padding: 24px; }
    .card + .card { margin-top: 22px; }
    .card h2 { font-size: 1.1rem; color: var(--heading); margin-bottom: 6px; }
    .sub { color: var(--text-5); font-size: 0.85rem; margin-bottom: 12px; }
    .crumbs { margin: 0 0 18px; font-size: 0.85rem; }
    .crumbs a { color: var(--heading); font-weight: 600; text-decoration: none; }
    .crumbs a:hover { text-decoration: underline; }
    .phases { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 2px; }
    .ph { padding: 3px 10px; border-radius: 12px; font-size: 0.76rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
    .ph.active { background: var(--ok-bg); color: var(--ok-fg); border-color: transparent; }
    .table-filter { width: 100%; max-width: 460px; padding: 9px 12px; border: 1.5px solid var(--border-2); border-radius: 8px; font-size: 0.92rem; margin-bottom: 12px; background: var(--surface); color: var(--text); }
    .table-wrap { overflow: auto; max-height: 76vh; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { position: sticky; top: 0; z-index: 2; background: var(--surface-3); padding: 9px 12px; text-align: left; font-weight: 600; color: var(--text-2); font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; box-shadow: inset 0 -1px 0 var(--border-2); cursor: pointer; user-select: none; }
    th:hover { background: var(--border); }
    td { padding: 8px 12px; border-top: 1px solid var(--border); vertical-align: top; }
    tr:hover td { background: var(--surface-2); }
    .muted { color: var(--text-5); }
    .who { font-size: 0.8rem; color: var(--text-4); }
    .sec { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; }
    .sec-public { background: var(--ok-bg); color: var(--ok-fg); }
    .sec-conf { background: var(--warn-bg); color: var(--warn-fg); }
    .dl-links { display: inline-flex; gap: 8px; white-space: nowrap; align-items: center; }
    .btn-view, .btn-dl { display: inline-block; cursor: pointer; font-size: 0.78rem; font-weight: 600; border: none; padding: 4px 12px; border-radius: 5px; text-decoration: none; }
    .btn-view { color: #fff; background: var(--brand); }
    .btn-view:hover { background: var(--brand-hover); }
    .btn-dl { color: var(--heading); background: var(--border); }
    .btn-dl:hover { background: var(--border-2); }
    .edis-link { font-size: 0.8rem; color: var(--text-5); font-weight: 600; text-decoration: none; }
    .edis-link:hover { text-decoration: underline; }
    .na { color: var(--text-5); font-size: 0.8rem; }
    .state { text-align: center; padding: 40px 20px; color: var(--text-5); }
    .disclaimer { font-size: 0.76rem; color: var(--text-4); margin-top: 12px; line-height: 1.5; }
    .table-pager { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 14px; }
    .pg { padding: 5px 10px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--surface); color: var(--heading); font-weight: 600; font-size: 0.82rem; cursor: pointer; }
    .pg:hover:not(:disabled) { background: var(--surface-3); }
    .pg:disabled { opacity: 0.45; cursor: default; }
    .pg.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header>
  <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
    <rect width="36" height="36" rx="6" fill="white" opacity="0.15"/>
    <path d="M8 28V12l10-6 10 6v16H8z" stroke="white" stroke-width="1.5" fill="none"/>
    <rect x="14" y="18" width="8" height="10" fill="white" opacity="0.6"/>
    <circle cx="18" cy="14" r="2.5" fill="white" opacity="0.8"/>
  </svg>
  <div>
    <h1><a href="/itc" id="hdrTitle">USITC Section 337 Investigation</a></h1>
    <p>Documents via EDIS · edis.usitc.gov</p>
  </div>
</header>

<div class="container">
  <div class="crumbs"><a href="/itc">← All Section 337 investigations</a></div>

  <div class="card">
    <h2 id="invTitle">Loading…</h2>
    <p class="sub" id="invMeta"></p>
    <div class="phases" id="phases"></div>
  </div>

  <div class="card">
    <input type="search" class="table-filter" id="q" placeholder="Filter by document type, title, party, firm…" />
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-k="date">Filed</th>
            <th data-k="type">Type</th>
            <th data-k="title">Title</th>
            <th data-k="phase">Phase</th>
            <th data-k="security">Access</th>
            <th>Document</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="table-pager" id="pager"></div>
    <p class="disclaimer" id="disclaimer"></p>
  </div>
</div>

<script>
// Base of the ITC Blob store (same store as itc-data.json). Per-investigation
// document lists live at <base>/itc/inv/<number>.json, published by edis-upload.mjs.
const BLOB_BASE = "https://zektsojdx4i0uvfy.public.blob.vercel-storage.com";

const params = new URLSearchParams(location.search);
const INV = (params.get("inv") || "").trim();
const DATA_URL = params.get("data") || (INV ? `${BLOB_BASE}/itc/inv/${encodeURIComponent(INV)}.json` : "");

const state = { docs: [], q: "", sortK: "date", sortDir: -1, page: 0, pageSize: 60 };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isPublic = (d) => (d.security || "").toLowerCase() === "public";

function edisInvUrl() { return `https://edis.usitc.gov/external/search?investigationNumber=${encodeURIComponent(INV)}`; }

// View / Download links per document, matching the rest of the app. The proxy
// resolves attachments and streams the PDF (inline for View, attachment for
// Download); a mirrored Blob copy is preferred when present. Multi-attachment
// documents open an on-site picker page served by the proxy.
function docCell(d) {
  if (d.mirrorUrl) {
    return `<span class="dl-links"><a class="btn-view" href="${esc(d.mirrorUrl)}" target="_blank" rel="noopener">View</a><a class="btn-dl" href="${esc(d.mirrorUrl)}" download>Download</a></span>`;
  }
  if (!isPublic(d)) return `<span class="na">Confidential — not available</span>`;
  // EDIS blocks server-side downloads (datacenter IP) and anonymous API access
  // cannot download attachments, so non-mirrored public docs open in EDIS, where
  // the user downloads via their own Login.gov session. Mirrored docs (above)
  // download straight from this site as buttons.
  return `<a class="edis-link" href="${edisInvUrl()}" target="_blank" rel="noopener" title="Opens this investigation in EDIS — downloading requires signing in to EDIS">On EDIS ↗</a>`;
}

function applyFilter() {
  const q = state.q.toLowerCase().trim();
  let rows = state.docs.filter((d) => !q || [d.type, d.title, d.onBehalfOf, d.firm, d.filedBy, d.phase].join(" ").toLowerCase().includes(q));
  const dir = state.sortDir, k = state.sortK;
  rows.sort((a, b) => String(a[k] == null ? "" : a[k]).localeCompare(String(b[k] == null ? "" : b[k])) * dir);
  state.filtered = rows;
}

function renderRows() {
  const start = state.page * state.pageSize;
  const slice = state.filtered.slice(start, start + state.pageSize);
  if (!slice.length) { $("rows").innerHTML = `<tr><td colspan="6" class="state">No matching documents.</td></tr>`; }
  else $("rows").innerHTML = slice.map((d) => {
    const who = [d.onBehalfOf ? `on behalf of ${esc(d.onBehalfOf)}` : "", d.firm ? esc(d.firm) : ""].filter(Boolean).join(" · ");
    return `<tr>
      <td>${esc(d.date || "—")}</td>
      <td>${esc(d.type || "")}</td>
      <td>${esc(d.title || "")}${who ? `<div class="who">${who}</div>` : ""}</td>
      <td>${esc(d.phase || "")}</td>
      <td><span class="sec ${isPublic(d) ? "sec-public" : "sec-conf"}">${esc(d.security || "—")}</span></td>
      <td>${docCell(d)}</td>
    </tr>`;
  }).join("");
  renderPager();
}

function renderPager() {
  const total = state.filtered.length;
  const pages = Math.max(1, Math.ceil(total / state.pageSize));
  const cur = state.page + 1, start = state.page * state.pageSize;
  const end = Math.min(start + state.pageSize, total);
  const keep = [];
  for (let i = 1; i <= pages; i++) if (i === 1 || i === pages || (i >= cur - 2 && i <= cur + 2)) keep.push(i);
  const seq = []; let prevN;
  for (const i of keep) { if (prevN) { if (i - prevN === 2) seq.push(prevN + 1); else if (i - prevN > 2) seq.push("…"); } seq.push(i); prevN = i; }
  const nums = seq.map((n) => n === "…"
    ? `<span style="padding:0 4px;color:var(--text-4)">…</span>`
    : `<button class="pg${n === cur ? " active" : ""}" data-p="${n}">${n}</button>`).join("");
  $("pager").innerHTML = `
    <span class="muted" style="font-size:0.82rem">${total ? `Showing ${start + 1}–${end} of ${total} documents` : "No documents"}</span>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center">
      <button class="pg" data-p="prev" ${cur <= 1 ? "disabled" : ""}>‹ Prev</button>${nums}<button class="pg" data-p="next" ${cur >= pages ? "disabled" : ""}>Next ›</button>
    </div>`;
  $("pager").querySelectorAll("button.pg[data-p]").forEach((b) => b.onclick = () => {
    const p = b.dataset.p;
    if (p === "prev") { if (state.page > 0) state.page--; }
    else if (p === "next") { if (state.page < pages - 1) state.page++; }
    else state.page = Number(p) - 1;
    renderRows();
  });
}

function wire() {
  $("q").oninput = (e) => { state.q = e.target.value; state.page = 0; applyFilter(); renderRows(); };
  document.querySelectorAll("th[data-k]").forEach((th) => th.onclick = () => {
    const k = th.dataset.k;
    if (state.sortK === k) state.sortDir *= -1; else { state.sortK = k; state.sortDir = 1; }
    state.page = 0; applyFilter(); renderRows();
  });
}

async function load() {
  if (!INV) { $("invTitle").textContent = "No investigation specified."; $("rows").innerHTML = `<tr><td colspan="6" class="state">Add ?inv=337-XXXX to the URL.</td></tr>`; return; }
  document.title = `ITC ${INV} — Documents`;
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (res.status === 404) {
      $("invTitle").textContent = INV;
      $("invMeta").innerHTML = `Documents for this investigation haven't been crawled yet. <a class="link" href="${edisInvUrl()}" target="_blank" rel="noopener" style="color:var(--heading);font-weight:600">View on EDIS ↗</a>`;
      $("rows").innerHTML = `<tr><td colspan="6" class="state">Not yet crawled. Run the document crawl for ${esc(INV)}, then re-publish.</td></tr>`;
      return;
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.docs = data.documents || [];
    // Pre-institution matters show their EDIS docket number (DN xxxx), not a
    // 337-TA investigation number (which EDIS misleadingly puts in the title).
    // Docket when the number's numeric part equals the docket, or preinstitution.
    const x = String(INV).split("-")[1] || "";
    const docket = (data.phases || []).map((p) => p.docket).find(Boolean) || "";
    const isDN = (docket && x === String(docket)) || (data.phases || []).some((p) => p.status === "Preinstitution");
    const label = isDN ? "DN " + (docket || x) : (data.publicNumber || INV);
    $("hdrTitle").textContent = `USITC ${label}`;
    $("invTitle").textContent = data.title || label;
    const pubCount = state.docs.filter(isPublic).length;
    $("invMeta").innerHTML = `${label} · ${state.docs.length} documents (${pubCount} public / downloadable) · <a href="${edisInvUrl()}" target="_blank" rel="noopener" style="color:var(--heading);font-weight:600">EDIS ↗</a>`;
    $("phases").innerHTML = (data.phases || []).map((p) => `<span class="ph ${p.status === "Active" ? "active" : ""}">${esc(p.phase)}${p.status ? " · " + esc(p.status) : ""}</span>`).join("");
    $("disclaimer").innerHTML = `Documents and metadata from USITC EDIS. Confidential filings are listed but not downloadable. Documents mirrored to this site download here; the rest open in EDIS, where downloading requires signing in. Verify anything material against EDIS. Not legal advice.`;
    wire(); applyFilter(); renderRows();
  } catch (e) {
    $("invTitle").textContent = INV;
    $("rows").innerHTML = `<tr><td colspan="6" class="state">Could not load documents (${esc(e.message)}).</td></tr>`;
  }
}
load();
</script>
</body>
</html>
